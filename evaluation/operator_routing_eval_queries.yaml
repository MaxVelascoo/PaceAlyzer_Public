---
# Experimento B: evaluación del routing del Operator.
# Este dataset está organizado según el contexto que necesita cada query:
# 1. stateless: no necesita current_workout ni historial previo
# 2. requires_current_workout: depende de que exista un entreno ya cargado en el día de referencia
# 3. requires_conversation_history: el mensaje solo tiene sentido con historial conversacional previo
#
# Nota para el futuro script de evaluación:
# - El Operator recibe:
#   - system prompt fijo de app/agents/operator_agent.py
#   - user prompt con:
#       * _week_context()
#       * conversation_history si existe
#       * format_context_for_prompt(athlete_context) si existe
#       * resumen de current_workout del state['date']
#       * mensaje actual del usuario
# - athlete_context puede rellenarse en el script con valores sintéticos completos a partir
#   de estos mínimos, igual que en el experimento A.

# ---------------------------------------------------------------------------
# BLOQUE 1: QUERIES STATELESS
# No necesitan current_workout ni historial previo. Aquí evaluamos routing puro
# desde el mensaje del usuario más el contexto general del atleta y la fecha.
# ---------------------------------------------------------------------------

